  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts (NanumSquareRound removed: font files missing under lib/assets/font/; theme uses Pretendard)
  fonts:
    # Inter from your zip: 18pt static + variable font (for weight 100–1000)
    - family: Inter
      fonts:
        - asset: lib/assets/font/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: lib/assets/font/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: lib/assets/font/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: lib/assets/font/Inter/Inter_18pt-Bold.ttf
          weight: 700
        - asset: lib/assets/font/Inter/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: lib/assets/font/Inter/Inter_18pt-Black.ttf
          weight: 900
        # Variable font: allows FontVariation('wght', 1000) for heavier-than-Black
        - asset: lib/assets/font/Inter/Inter-VariableFont_opsz,wght.ttf
          weight: 400
    # Pretendard: use wherever Figma specifies Inter (temp screen and Figma-derived UI)
    - family: Pretendard
      fonts:
        - asset: lib/assets/font/Pretendard/Pretendard-Thin.otf
          weight: 100
        - asset: lib/assets/font/Pretendard/Pretendard-ExtraLight.otf
          weight: 200
        - asset: lib/assets/font/Pretendard/Pretendard-Light.otf
          weight: 300
        - asset: lib/assets/font/Pretendard/Pretendard-Regular.otf
          weight: 400
        - asset: lib/assets/font/Pretendard/Pretendard-Medium.otf
          weight: 500
        - asset: lib/assets/font/Pretendard/Pretendard-SemiBold.otf
          weight: 600
        - asset: lib/assets/font/Pretendard/Pretendard-Bold.otf
          weight: 700
        - asset: lib/assets/font/Pretendard/Pretendard-ExtraBold.otf
          weight: 800
        - asset: lib/assets/font/Pretendard/Pretendard-Black.otf
          weight: 900
    - family: Caveat
      fonts:
        - asset: lib/assets/font/Caveat/Caveat-Bold.ttf
          weight: 700
    # 학교안심 사물함 — recipe title display (kept for A/B)
    - family: HakgyoansimSamulham
      fonts:
        - asset: lib/assets/font/HakgyoansimSamulham/HakgyoansimSamulhamOTFR.otf
          weight: 400
        - asset: lib/assets/font/HakgyoansimSamulham/HakgyoansimSamulhamR.ttf
          weight: 400
    # 학교안심 지우개 — active recipe title display
    - family: HakgyoansimJiugae
      fonts:
        - asset: lib/assets/font/HakgyoansimJiugae/HakgyoansimJiugaeOTFR.otf
          weight: 400
        - asset: lib/assets/font/HakgyoansimJiugae/HakgyoansimJiugaeR.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/Yorigo_logo_new.png
  remove_alpha_ios: true
