		B1F6BB802ED07CF30043C17A /* Embed ShareExtension */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Embed ShareExtension";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Embed ShareExtension for all builds (debug and release)\n# This runs AFTER all other phases complete to avoid build cycles\n\nSHARE_EXT_SOURCE=\"${BUILT_PRODUCTS_DIR}/ShareExtension.appex\"\nPLUGINS_DIR=\"${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/PlugIns\"\nSHARE_EXT_DEST=\"${PLUGINS_DIR}/ShareExtension.appex\"\n\n# Debug: Print paths\necho \"DEBUG: BUILT_PRODUCTS_DIR=${BUILT_PRODUCTS_DIR}\"\necho \"DEBUG: WRAPPER_NAME=${WRAPPER_NAME}\"\necho \"DEBUG: SHARE_EXT_SOURCE=${SHARE_EXT_SOURCE}\"\necho \"DEBUG: PLUGINS_DIR=${PLUGINS_DIR}\"\necho \"DEBUG: SHARE_EXT_DEST=${SHARE_EXT_DEST}\"\n\n# Check if ShareExtension exists\nif [ ! -d \"${SHARE_EXT_SOURCE}\" ]; then\n    echo \"ERROR: ShareExtension.appex not found at ${SHARE_EXT_SOURCE}\"\n    echo \"Make sure ShareExtension target is built and is a dependency of Runner target\"\n    # For archive builds, this is critical - fail the build\n    if [ \"${ACTION}\" == \"install\" ] || [ \"${ACTION}\" == \"archive\" ]; then\n        exit 1\n    fi\n    # For regular builds, just warn but continue\n    echo \"Warning: Continuing without ShareExtension (not an archive build)\"\n    exit 0\nfi\n\n# Create PlugIns directory (with verbose output)\necho \"Creating PlugIns directory: ${PLUGINS_DIR}\"\nmkdir -p \"${PLUGINS_DIR}\"\nif [ $? -ne 0 ]; then\n    echo \"ERROR: Failed to create PlugIns directory\"\n    exit 1\nfi\n\n# Remove existing ShareExtension if it exists (including symlinks)\nif [ -e \"${SHARE_EXT_DEST}\" ] || [ -L \"${SHARE_EXT_DEST}\" ]; then\n    echo \"Removing existing ShareExtension (file or symlink)...\"\n    # Force remove, including symlinks\n    rm -f \"${SHARE_EXT_DEST}\"\n    rm -rf \"${SHARE_EXT_DEST}\"\n    # Wait a moment to ensure removal\n    sleep 0.1\n    if [ -e \"${SHARE_EXT_DEST}\" ] || [ -L \"${SHARE_EXT_DEST}\" ]; then\n        echo \"Warning: Still exists after removal, trying unlink...\"\n        unlink \"${SHARE_EXT_DEST}\" 2>/dev/null || true\n    fi\nfi\n\n# Copy ShareExtension using ditto (more reliable for app bundles)\necho \"Copying ShareExtension from ${SHARE_EXT_SOURCE} to ${PLUGINS_DIR}...\"\n# Use ditto which handles app bundles better than cp\nditto \"${SHARE_EXT_SOURCE}\" \"${SHARE_EXT_DEST}\"\nCOPY_EXIT_CODE=$?\n\nif [ $COPY_EXIT_CODE -ne 0 ]; then\n    echo \"ERROR: Copy command failed with exit code ${COPY_EXIT_CODE}\"\n    echo \"Source exists: $([ -d \"${SHARE_EXT_SOURCE}\" ] && echo 'YES' || echo 'NO')\"\n    echo \"Destination directory exists: $([ -d \"${PLUGINS_DIR}\" ] && echo 'YES' || echo 'NO')\"\n    exit 1\nfi\n\n# Verify copy succeeded\nif [ ! -d \"${SHARE_EXT_DEST}\" ]; then\n    echo \"ERROR: Failed to copy ShareExtension to ${SHARE_EXT_DEST}\"\n    echo \"PlugIns directory contents:\"\n    ls -la \"${PLUGINS_DIR}\" || true\n    exit 1\nfi\n\necho \"ShareExtension copied successfully\"\n\n# Code sign the extension (ShareExtension should already be signed, but verify)\necho \"Verifying ShareExtension signature...\"\n# Check if already signed and valid\nif codesign -dv \"${SHARE_EXT_DEST}\" 2>/dev/null; then\n    codesign -vv \"${SHARE_EXT_DEST}\" 2>&1\n    if [ $? -eq 0 ]; then\n        echo \"ShareExtension signature is valid\"\n    else\n        echo \"Warning: ShareExtension signature verification failed\"\n        echo \"Xcode will re-sign it during the archive process\"\n    fi\nelse\n    echo \"Warning: ShareExtension is not signed, but Xcode will sign it during archive\"\nfi\n# Note: We don't manually sign here because:\n# 1. ShareExtension is already signed when built\n# 2. Xcode will automatically re-sign it during archive with the correct identity\n# 3. Manual signing with wrong identity causes errors\n\necho \"ShareExtension embedded successfully at ${SHARE_EXT_DEST}\"\n";
			showEnvVarsInLog = 0;
		};
