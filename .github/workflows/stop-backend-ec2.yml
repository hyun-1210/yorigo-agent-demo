# EC2 is intentionally STOPPED / dormant.
# Prefer leaving it stopped. Only use this if the instance was started again
# and needs an emergency shutdown. Daily Firestore guard does NOT call this.
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, EC2_INSTANCE_ID
name: Stop Backend EC2

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

jobs:
  stop:
    name: Stop EC2 via SSM shutdown
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Shutdown instance over SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID}" ]; then
            echo "EC2_INSTANCE_ID secret is empty"
            exit 1
          fi

          echo "Sending graceful shutdown to instance (SSM)..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Stop Backend EC2 (GitHub Actions)" \
            --parameters 'commands=["sudo /sbin/shutdown -h now || sudo poweroff"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: $COMMAND_ID"

          # Agent often dies mid-command during shutdown; treat Success / Failed /
          # Undeliverable after delivery as acceptable once the host is gone.
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Unknown")
            echo "SSM status ($i/36): $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Shutdown command completed."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              OUT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "[StandardOutputContent,StandardErrorContent]" \
                --output text 2>/dev/null || true)
              echo "$OUT"
              # Host powering off commonly surfaces as Failed/TimedOut — OK.
              echo "Host likely shutting down (SSM status=$STATUS)."
              exit 0
            fi

            sleep 5
          done

          echo "Timed out waiting for SSM; shutdown may still be in progress."
          exit 0
